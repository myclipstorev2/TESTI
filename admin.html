<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — MYCLIPS STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:500 14px 'Archivo',sans-serif;color:#0F0F0F;background:#FAF6E9;background-image:radial-gradient(rgba(0,0,0,.22) 1.4px,transparent 1.4px);background-size:20px 20px;min-height:100vh}
.hide{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{position:sticky;top:0;z-index:5;background:#FDE047;border-bottom:3px solid #000;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 0;max-width:760px;margin:0 auto}
nav button{flex-shrink:0}
.card{background:#fff;border:3px solid #000;border-radius:16px;box-shadow:5px 5px 0 #000;padding:14px;margin-bottom:14px}
.y{background:#FDE047}.pu{background:#C4A5F5}.c{background:#5EEAD4}.g{background:#BEF264}.pk{background:#F472B6}
button{font:800 12px 'Archivo',sans-serif;border:2.5px solid #000;border-radius:10px;background:#fff;padding:8px 12px;cursor:pointer;box-shadow:2px 2px 0 #000;color:#000}
button:active{transform:translate(2px,2px);box-shadow:none}
button.on{background:#F472B6}
button.p{background:#F472B6;width:100%;padding:12px;font-size:14px;margin-top:10px}
button.s{padding:6px 10px}
button:disabled{opacity:.6;cursor:wait}
input{width:100%;border:2.5px solid #000;border-radius:10px;padding:10px;font:600 14px 'Archivo',sans-serif;background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row input{flex:1;min-width:140px}.row input[type=number]{flex:0 0 80px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.grid .card{margin:0;text-align:center}.grid b{display:block;font-size:22px;font-weight:900}
.tag{display:inline-block;border:2px solid #000;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:800;background:#BEF264}
.tag.r{background:#F472B6}.tag.k{background:#FDE047}
.m{font-size:12px;opacity:.75;word-break:break-all}
h3{font-weight:900;margin-bottom:6px}
a{color:#000;font-weight:700}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:9;transition:transform .3s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}#toast.err{background:#DC2626}#toast.ok{background:#16A34A}
</style>
</head>
<body>
<div id="login" class="wrap">
  <div class="card y">
    <h3>🔐 Admin MYCLIPS</h3>
    <div class="row"><input id="pw" type="password" placeholder="Password admin" autocomplete="off"></div>
    <button class="p" id="btnMasuk" type="button">Masuk</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <b>MYCLIPS ADMIN</b>
    <span><button class="s" data-a="ref" type="button">⟳ Muat ulang</button> <button class="s" data-a="out" type="button">Keluar</button></span>
  </div>
  <nav id="nav"></nav>
  <div class="wrap" id="main"></div>
</div>
<div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyDbTKmfz5rfoW_CooH0VHhwVP_cBkvib3-l_R4QuKLZQfFlPmVehq1qxDLifCSMxAa/exec';
// Password hanya disimpan di memori halaman (hilang saat refresh)
let pass = '', D = null, tab = 'ringkasan', q = '', fg = 'menunggu', fa = 'belum';
const TABS = [['ringkasan', 'Ringkasan'], ['order', 'Order'], ['garansi', 'Garansi'], ['link', 'Link Canva'], ['akses', 'Akses']];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const href = u => /^https?:\/\//i.test(u) ? esc(u) : '#';
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const wa = n => { let d = String(n).replace(/\D/g, ''); if (d[0] === '0') d = '62' + d.slice(1); return 'https://wa.me/' + d; };
let tt;
function toast(m, t) { const e = $('toast'); e.textContent = m; e.className = 'show ' + (t || ''); clearTimeout(tt); tt = setTimeout(() => e.className = '', 3500); }

async function api(op, p) {
  try {
    const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'admin', pass, op }, p || {})) });
    return await r.json();
  } catch (e) { return { success: false, message: 'Koneksi gagal' }; }
}
async function muat() {
  const r = await api('muat');
  if (!r.success) { toast(r.message || 'Gagal memuat', 'err'); return false; }
  D = r; render(); return true;
}

const chips = (k, a, v) => '<div class="ch">' + a.map(x => `<button class="s ${x[0] === v ? 'on' : ''}" data-f="${k}:${x[0]}">${x[1]}</button>`).join('') + '</div>';

function ringkasan() {
  const O = D.orders, hari = new Date().toLocaleDateString('en-GB');
  const c = (t, v, k) => `<div class="card ${k}"><b>${v}</b>${t}</div>`;
  return `<div class="grid">${c('Total order', O.length, 'y')}${c('Pendapatan', rp(O.reduce((s, o) => s + o.hg, 0)), 'g')}${c('Order hari ini', O.filter(o => o.ts.startsWith(hari)).length, 'c')}${c('Menunggu link garansi', O.filter(o => o.si > 0 && !o.lk && !o.iv).length, 'pk')}${c('Siap klaim', O.filter(o => o.si > 0 && o.lk && !o.iv).length, 'pu')}${c('Akses belum dibuka', D.akses.filter(a => !a.db).length, 'y')}</div><div class="card"><h3>Link Canva aktif</h3><p class="m">${esc(D.link) || '(belum diatur)'}</p></div>`;
}

function render() {
  $('nav').innerHTML = TABS.map(t => `<button class="${t[0] === tab ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  const m = $('main');
  if (tab === 'ringkasan') m.innerHTML = ringkasan();
  else if (tab === 'link') {
    m.innerHTML = `<div class="card y"><h3>Link Canva aktif</h3><p class="m">Ganti tiap ~3 hari. Hanya berlaku untuk order baru.</p><div class="row"><input id="cfg" value="${esc(D.link)}" placeholder="https://www.canva.com/..."></div><button class="p" data-a="cfg">Simpan Link</button><div class="row"><button class="s" data-a="tes">Tes buka link</button></div></div>`;
  } else {
    let h = `<input id="q" placeholder="Cari WA / email / kode..." value="${esc(q)}" autocomplete="off">`;
    if (tab === 'garansi') h += chips('fg', [['menunggu', 'Menunggu link'], ['siap', 'Siap klaim'], ['habis', 'Jatah 0/habis'], ['semua', 'Semua']], fg);
    if (tab === 'akses') h += chips('fa', [['belum', 'Belum dibuka'], ['sudah', 'Sudah dibuka'], ['semua', 'Semua']], fa);
    m.innerHTML = h + '<div id="list" style="margin-top:12px"></div>';
    $('q').addEventListener('input', e => { q = e.target.value; isi(); });
    isi();
  }
}

function isi() {
  const s = q.toLowerCase(); let h = '';
  const cocok = o => (o.wa + o.em + o.kd).toLowerCase().includes(s);
  if (tab === 'order') {
    h = D.orders.filter(cocok).slice().reverse().map(o => `<div class="card"><b>${esc(o.pk)}</b> · ${rp(o.hg)} <span class="tag k">${esc(o.ts)}</span><p>${esc(o.wa)} · ${esc(o.em)}</p><p class="m">Kode ${esc(o.kd)} · Akses sampai ${esc(o.ak)}</p><div class="row"><a href="${wa(o.wa)}" target="_blank" rel="noopener">WhatsApp</a><a href="${href(o.bk)}" target="_blank" rel="noopener">Bukti transfer</a><button class="s" data-a="salin" data-k="${esc(o.kd)}">Salin kode</button></div></div>`).join('');
  } else if (tab === 'garansi') {
    const f = o => fg === 'semua' || (fg === 'habis' ? (o.si <= 0 || o.iv) : fg === 'menunggu' ? (o.si > 0 && !o.lk && !o.iv) : (o.si > 0 && o.lk && !o.iv));
    h = D.orders.filter(o => f(o) && cocok(o)).slice().reverse().map(o => `<div class="card"><b>${esc(o.kd)}</b> <span class="tag ${o.iv ? 'r' : o.si > 0 ? '' : 'k'}">${o.iv ? 'Diblokir' : 'Sisa klaim ' + o.si}</span><p>${esc(o.wa)} · ${esc(o.pk)} · akses sampai ${esc(o.ak)}</p>${o.kt ? `<p class="m">Klaim terakhir ${esc(o.kt)} (${esc(o.kw)})</p>` : ''}<div class="row"><input id="lk${o.r}" placeholder="Link garansi baru" value="${esc(o.lk)}"><button class="s" data-a="lk" data-r="${o.r}" data-k="${esc(o.kd)}">Simpan link</button></div><div class="row"><input type="number" id="si${o.r}" min="0" max="20" value="${o.iv ? 0 : o.si}"><button class="s" data-a="si" data-r="${o.r}" data-k="${esc(o.kd)}">Simpan sisa</button><button class="s" data-a="iv" data-r="${o.r}" data-k="${esc(o.kd)}">Blokir</button><a href="${wa(o.wa)}" target="_blank" rel="noopener">WhatsApp</a></div></div>`).join('');
  } else if (tab === 'akses') {
    h = D.akses.filter(x => (fa === 'semua' || (fa === 'belum' ? !x.db : !!x.db)) && (x.wa + x.kd + x.tk).toLowerCase().includes(s)).slice().reverse().map(x => `<div class="card"><span class="tag ${x.db ? '' : 'k'}">${x.db ? 'Dibuka ' + esc(x.db) : 'Belum dibuka'}</span> <span class="m">dibuat ${esc(x.dt)}</span><p>${esc(x.wa) || '-'} ${x.kd ? '· ' + esc(x.kd) : ''}</p><p class="m">${esc(x.tk)}</p><p class="m">${esc(x.lk)}</p></div>`).join('');
  }
  $('list').innerHTML = h || '<div class="card">Tidak ada data.</div>';
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.t) { tab = b.dataset.t; q = ''; return render(); }
  if (b.dataset.f) { const [k, v] = b.dataset.f.split(':'); if (k === 'fg') fg = v; else fa = v; return render(); }
  const a = b.dataset.a; if (!a) return;
  if (a === 'out') { pass = ''; D = null; $('app').classList.add('hide'); $('login').classList.remove('hide'); return; }
  if (a === 'ref') { if (await muat()) toast('Data dimuat ulang', 'ok'); return; }
  if (a === 'salin') { try { await navigator.clipboard.writeText(b.dataset.k); toast('Kode disalin', 'ok'); } catch (x) { toast('Gagal menyalin', 'err'); } return; }
  if (a === 'tes') { window.open(D.link, '_blank', 'noopener'); return; }
  const r0 = b.dataset.r, k = b.dataset.k; let r;
  b.disabled = true;
  if (a === 'cfg') r = await api('setConfig', { link: $('cfg').value });
  else if (a === 'lk') r = await api('simpanLink', { r: r0, kode: k, link: $('lk' + r0).value });
  else if (a === 'si') r = await api('setSisa', { r: r0, kode: k, sisa: $('si' + r0).value });
  else if (a === 'iv') r = await api('setSisa', { r: r0, kode: k, sisa: 'invalid' });
  b.disabled = false;
  if (!r || !r.success) return toast((r && r.message) || 'Gagal menyimpan', 'err');
  toast('Tersimpan', 'ok');
  await muat();
});

$('btnMasuk').onclick = async () => {
  pass = $('pw').value; $('pw').value = '';
  if (!pass) return;
  $('btnMasuk').disabled = true;
  const ok = await muat();
  $('btnMasuk').disabled = false;
  if (ok) { $('login').classList.add('hide'); $('app').classList.remove('hide'); } else pass = '';
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnMasuk').click(); });
</script>
</body>
</html>
