<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>QRIS Decoder</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: #FAF6E9; padding: 40px 20px; }
  .box { max-width: 640px; margin: 0 auto; background: white; border: 3px solid #0F0F0F; border-radius: 20px; padding: 24px; box-shadow: 6px 6px 0 #0F0F0F; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .drop { border: 3px dashed #0F0F0F; border-radius: 14px; padding: 40px; text-align: center; cursor: pointer; background: #FAF6E9; }
  .drop:hover { background: #FDE047; }
  textarea { width: 100%; min-height: 180px; font-family: monospace; font-size: 13px; padding: 12px; border: 2.5px solid #0F0F0F; border-radius: 10px; margin-top: 16px; }
  .status { margin-top: 12px; font-weight: 700; }
  .ok { color: #16A34A; }
  .err { color: #DC2626; }
  .copy-btn { background: #F472B6; border: 2.5px solid #0F0F0F; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0 #0F0F0F; margin-top: 10px; }
  .copy-btn:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 #0F0F0F; }
</style>
</head>
<body>
<div class="box">
  <h1>🔍 QRIS Decoder — Ambil String</h1>
  <div class="drop" id="drop">
    <div style="font-size:40px;">📸</div>
    <div style="font-weight:700; margin-top:8px;">Drag & drop qrisku.png di sini</div>
    <div style="font-size:13px; opacity:0.6; margin-top:4px;">atau klik untuk pilih file</div>
  </div>
  <div class="status" id="status"></div>
  <textarea id="result" placeholder="String QRIS akan muncul di sini..." readonly></textarea>
  <button class="copy-btn" id="copyBtn" style="display:none;">📋 Copy String</button>
</div>
<script>
const drop = document.getElementById('drop');
const status = document.getElementById('status');
const result = document.getElementById('result');
const copyBtn = document.getElementById('copyBtn');

drop.addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = e => handle(e.target.files[0]);
  inp.click();
});

drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.background = '#FDE047'; });
drop.addEventListener('dragleave', () => drop.style.background = '#FAF6E9');
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.style.background = '#FAF6E9';
  if (e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]);
});

copyBtn.addEventListener('click', () => {
  result.select();
  document.execCommand('copy');
  copyBtn.textContent = '✓ Copied!';
  setTimeout(() => copyBtn.textContent = '📋 Copy String', 1500);
});

function handle(file) {
  status.textContent = '⏳ Memproses...';
  status.className = 'status';
  result.value = '';
  copyBtn.style.display = 'none';

  const img = new Image();
  img.onload = () => {
    // Coba beberapa skala untuk memaksimalkan peluang sukses
    const scales = [1, 0.5, 1.5, 2];
    let found = null;

    for (const s of scales) {
      const w = Math.floor(img.naturalWidth * s);
      const h = Math.floor(img.naturalHeight * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h);
      
      // Try normal + inverted
      let code = jsQR(data.data, w, h, { inversionAttempts: 'attemptBoth' });
      if (!code || !code.data) {
        code = jsQR(data.data, w, h, { inversionAttempts: 'onlyInvert' });
      }
      if (code && code.data) {
        found = code.data;
        break;
      }
    }

    if (found) {
      status.textContent = '✓ BERHASIL decode! Copy string di bawah.';
      status.className = 'status ok';
      result.value = found;
      copyBtn.style.display = 'inline-block';
      console.log('QRIS String:', found);
    } else {
      status.textContent = '✗ Gagal decode. Coba crop ulang lebih ketat atau perbesar resolusinya.';
      status.className = 'status err';
    }
  };
  img.onerror = () => {
    status.textContent = '✗ Gagal load gambar.';
    status.className = 'status err';
  };
  img.src = URL.createObjectURL(file);
}
</script>
</body>
</html>
